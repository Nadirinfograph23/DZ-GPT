name: Deploy Cloudflare Worker

run-name: "🚀 نشر DZ Agent — ${{ github.sha }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy dzagent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use public npm tarballs in CI
        run: sed -i 's#http://package-firewall\\.replit\\.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Generate deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public data
          COMMIT="${GITHUB_SHA}"
          SHORT="${COMMIT:0:8}"
          MESSAGE="$(git log -1 --pretty=%B | tr '\\n' ' ' | sed 's/[[:space:]]\\+/ /g; s/^ *//; s/ *$//')"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MESSAGE_JSON="$(printf '%s' "$MESSAGE" | python -c 'import json,sys; print(json.dumps(sys.stdin.read(), ensure_ascii=False))')"
          cat > public/version.json <<EOF
{
  "commit": "$COMMIT",
  "commitShort": "$SHORT",
  "branch": "${GITHUB_REF_NAME}",
  "message": $MESSAGE_JSON,
  "deployedAt": "$DEPLOYED_AT",
  "deployedBy": "GitHub Actions + Cloudflare Workers"
}
EOF
          cp public/version.json data/build-info.json
          echo "Deploy metadata: $SHORT — $MESSAGE"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build application assets
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
