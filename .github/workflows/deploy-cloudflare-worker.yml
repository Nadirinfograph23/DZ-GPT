name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - devin/1774405518-init-dz-gpt
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy dzagent
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate deployment metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const commit = process.env.GITHUB_SHA;
          const message = execSync('git log -1 --pretty=%B', { encoding: 'utf8' }).replace(/\\s+/g, ' ').trim();
          const data = { commit, commitShort: commit.slice(0, 8), branch: process.env.GITHUB_REF_NAME, message, deployedAt: new Date().toISOString(), deployedBy: 'GitHub Actions + Cloudflare Workers' };
          fs.mkdirSync('public', { recursive: true });
          fs.writeFileSync('public/version.json', JSON.stringify(data, null, 2) + '\\n');
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/build-info.json', JSON.stringify(data, null, 2) + '\\n');
          NODE

      - name: Use public npm tarballs in CI
        run: sed -i 's#http://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application assets
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
      - name: Verify production deployment
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for i in 1 2 3 4 5 6; do
            actual="$(curl -fsSL --max-time 10 "https://dzagent.app/version.json?_=$GITHUB_RUN_ID-$i" || true)"
            if printf '%s' "$actual" | grep -Fq "\"commit\":\"$expected\""; then
              echo "Production is serving $expected"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose $expected via /version.json"
          exit 1

      - name: Smoke test YouTube search on production
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"شرح أدوات الفوتوشوب"}]}' \
            "https://dzagent.app/api/dz-agent-chat?_=$GITHUB_RUN_ID-youtube")"
          printf '%s' "$response" > /tmp/youtube-response.json
          if ! printf '%s' "$response" | grep -Fq 'youtube-insight'; then
            echo "YouTube smoke test failed: response is not using youtube-insight"
            cat /tmp/youtube-response.json
            exit 1
          fi
          if ! printf '%s' "$response" | grep -Fq 'youtubeResults'; then
            echo "YouTube smoke test failed: youtubeResults missing"
            cat /tmp/youtube-response.json
            exit 1
          fi
          echo "YouTube production route is active"
