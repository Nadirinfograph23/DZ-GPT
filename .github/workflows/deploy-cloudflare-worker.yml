name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy dzagent
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate deployment metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const commit = process.env.GITHUB_SHA;
          const short = commit.slice(0, 8);
          const message = execSync('git log -1 --pretty=%B', { encoding: 'utf8' }).replace(/\\s+/g, ' ').trim();
          const deployedAt = new Date().toISOString();
          const data = {
            commit,
            commitShort: short,
            branch: process.env.GITHUB_REF_NAME,
            message,
            deployedAt,
            deployedBy: 'GitHub Actions + Cloudflare Workers'
          };
          fs.mkdirSync('public', { recursive: true });
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('public/version.json', JSON.stringify(data, null, 2) + '\\n');
          fs.writeFileSync('data/build-info.json', JSON.stringify(data, null, 2) + '\\n');
          console.log('Deploy metadata:', short, message);
          NODE

      - name: Use public npm tarballs in CI
        run: sed -i 's#http://package-firewall\\.replit\\.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application assets
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
