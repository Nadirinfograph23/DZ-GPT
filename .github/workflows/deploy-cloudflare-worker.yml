name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - devin/1774405518-init-dz-gpt
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy dzagent
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate deployment metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const commit = process.env.GITHUB_SHA;
          const message = execSync('git log -1 --pretty=%B', { encoding: 'utf8' }).replace(/\s+/g, ' ').trim();
          const data = { commit, commitShort: commit.slice(0, 8), branch: process.env.GITHUB_REF_NAME, message, deployedAt: new Date().toISOString(), deployedBy: 'GitHub Actions + Cloudflare Workers' };
          fs.mkdirSync('public', { recursive: true });
          fs.writeFileSync('public/version.json', JSON.stringify(data, null, 2) + '\n');
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/build-info.json', JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Use public npm tarballs in CI
        run: sed -i 's#http://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application assets
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify production deployment version
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for i in 1 2 3 4 5 6 7 8; do
            version="$(curl -fsSL --max-time 10 "https://dzagent.app/api/version?_=$GITHUB_RUN_ID-$i" || true)"
            if printf '%s' "$version" | grep -Fq "\"commit\":\"$expected\""; then
              echo "Production API version is serving $expected"
              exit 0
            fi
            echo "Waiting for production version... attempt $i"
            sleep 10
          done
          echo "Production did not expose $expected via /api/version"
          exit 1

      - name: Verify production static version fallback
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          actual="$(curl -fsSL --max-time 10 "https://dzagent.app/version.json?_=$GITHUB_RUN_ID-static")"
          printf '%s' "$actual" | grep -Fq "\"commit\":\"$expected\"" || { echo "Static version mismatch"; printf '%s\n' "$actual"; exit 1; }

      - name: Smoke test YouTube search on production
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --max-time 40 \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"شرح أدوات الفوتوشوب"}]}' \
            "https://dzagent.app/api/dz-agent-chat?_=$GITHUB_RUN_ID-youtube")"
          printf '%s' "$response" > /tmp/youtube-response.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/youtube-response.json', 'utf8'));
          const results = Array.isArray(body.youtubeResults) ? body.youtubeResults : [];
          if (body.model !== 'youtube-insight') throw new Error('YouTube route did not activate: ' + JSON.stringify(body));
          if (results.length < 1) throw new Error('YouTube route returned zero results: ' + JSON.stringify(body));
          const valid = results.every(v => /^[A-Za-z0-9_-]{11}$/.test(String(v.id || '')) && v.title && v.thumbnail);
          if (!valid) throw new Error('YouTube results are malformed: ' + JSON.stringify(results));
          console.log(`YouTube production smoke test passed: ${results.length} valid result(s)`);
          NODE
