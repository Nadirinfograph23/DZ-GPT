name: Deploy to Vercel

on:
  push:
    branches:
      - devin/1774405518-init-dz-gpt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" | tee /tmp/vercel-response.json
          cat /tmp/vercel-response.json
