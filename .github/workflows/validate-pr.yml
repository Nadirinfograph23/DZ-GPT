name: Validate Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use public npm tarballs in CI
        run: sed -i 's#http://package-firewall\.replit\.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application assets
        run: npm run build

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.toml
