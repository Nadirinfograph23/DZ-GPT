<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DZ Excel Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#1e1e2e;color:#cdd6f4;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}

    /* ── TOOLBAR ── */
    #toolbar{
      display:flex;align-items:center;gap:2px;padding:4px 8px;
      background:#181825;border-bottom:1px solid #313244;
      flex-wrap:wrap;flex-shrink:0;min-height:38px;
      direction:rtl;
    }
    .tb-sep{width:1px;height:20px;background:#313244;margin:0 4px}
    .tb-btn{
      display:flex;align-items:center;justify-content:center;gap:4px;
      padding:4px 8px;border:none;border-radius:4px;cursor:pointer;
      background:transparent;color:#cdd6f4;font-size:12px;
      transition:background .15s;white-space:nowrap;
    }
    .tb-btn:hover{background:#313244}
    .tb-btn.active{background:#45475a;color:#cba6f7}
    .tb-btn svg{width:14px;height:14px;flex-shrink:0}
    .tb-select{
      background:#181825;border:1px solid #313244;color:#cdd6f4;
      padding:3px 6px;border-radius:4px;font-size:12px;cursor:pointer;
    }
    .tb-color{
      width:22px;height:22px;border-radius:4px;border:1px solid #313244;
      cursor:pointer;padding:1px;background:transparent;
    }

    /* ── FORMULA BAR ── */
    #formula-bar{
      display:flex;align-items:center;gap:8px;padding:3px 8px;
      background:#181825;border-bottom:1px solid #313244;flex-shrink:0;
      direction:ltr;
    }
    #cell-ref{
      min-width:56px;text-align:center;font-family:monospace;font-size:12px;
      background:#313244;border-radius:4px;padding:2px 6px;color:#a6e3a1;
      border:1px solid #45475a;cursor:default;user-select:none;
    }
    #formula-input{
      flex:1;background:#11111b;border:1px solid #45475a;color:#cdd6f4;
      padding:3px 8px;border-radius:4px;font-size:13px;font-family:monospace;
      direction:ltr;text-align:left;
    }
    #formula-input:focus{outline:none;border-color:#cba6f7}

    /* ── GRID ── */
    #grid-wrap{
      flex:1;overflow:auto;position:relative;
    }
    #grid-wrap::-webkit-scrollbar{width:8px;height:8px}
    #grid-wrap::-webkit-scrollbar-track{background:#181825}
    #grid-wrap::-webkit-scrollbar-thumb{background:#45475a;border-radius:4px}
    #grid-wrap::-webkit-scrollbar-corner{background:#181825}

    table#grid{border-collapse:collapse;table-layout:fixed;direction:ltr}

    th.col-header{
      position:sticky;top:0;z-index:10;
      background:#181825;border:1px solid #313244;
      min-width:80px;max-width:80px;padding:3px 4px;
      text-align:center;color:#7f849c;font-weight:600;font-size:11px;
      user-select:none;cursor:default;
    }
    th.row-header{
      position:sticky;left:0;z-index:10;
      background:#181825;border:1px solid #313244;
      min-width:40px;max-width:40px;padding:3px 4px;
      text-align:center;color:#7f849c;font-weight:600;font-size:11px;
      user-select:none;cursor:default;
    }
    th.corner{position:sticky;top:0;left:0;z-index:20;background:#181825}

    td.cell{
      border:1px solid #313244;min-width:80px;max-width:80px;
      height:22px;padding:0 4px;vertical-align:middle;
      overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
      cursor:cell;position:relative;
      background:#1e1e2e;color:#cdd6f4;font-size:12px;
    }
    td.cell.selected{outline:2px solid #89b4fa;outline-offset:-1px;z-index:5}
    td.cell.in-range{background:#313244}
    td.cell.header-cell{background:#181825;color:#cba6f7;font-weight:700}
    td.cell:hover:not(.selected){background:#252535}

    /* alignment */
    td.cell.align-center{text-align:center}
    td.cell.align-right{text-align:right}
    td.cell.align-left{text-align:left}

    /* ── INLINE EDITOR ── */
    #cell-editor{
      position:absolute;z-index:100;display:none;
      background:#11111b;border:2px solid #89b4fa;
      color:#cdd6f4;padding:0 4px;font-size:12px;
      font-family:inherit;direction:ltr;text-align:left;
      box-shadow:0 2px 8px rgba(0,0,0,.4);
    }

    /* ── CONTEXT MENU ── */
    #ctx-menu{
      display:none;position:fixed;z-index:200;
      background:#181825;border:1px solid #45475a;border-radius:6px;
      padding:4px 0;min-width:160px;box-shadow:0 4px 16px rgba(0,0,0,.5);
    }
    .ctx-item{
      padding:6px 14px;cursor:pointer;font-size:12px;color:#cdd6f4;
    }
    .ctx-item:hover{background:#313244}
    .ctx-sep{height:1px;background:#313244;margin:3px 0}

    /* ── STATUS BAR ── */
    #status-bar{
      display:flex;align-items:center;gap:16px;padding:2px 10px;
      background:#181825;border-top:1px solid #313244;
      font-size:11px;color:#7f849c;flex-shrink:0;
      direction:rtl;
    }
    #status-sel{color:#a6e3a1}
    #status-sum{color:#f9e2af}
    #status-avg{color:#89b4fa}

    /* ── LAYOUT ── */
    #app{display:flex;flex-direction:column;height:100vh}
    #grid-area{flex:1;display:flex;flex-direction:column;overflow:hidden}

    /* ── LOADING ── */
    #loading{
      position:fixed;inset:0;background:#1e1e2e;z-index:999;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:12px;font-size:14px;color:#7f849c;
    }
    .spinner{
      width:32px;height:32px;border:3px solid #313244;
      border-top-color:#89b4fa;border-radius:50%;animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div id="loading"><div class="spinner"></div><span>جارٍ تحميل محرر Excel...</span></div>
<div id="app" style="display:none">

  <!-- TOOLBAR -->
  <div id="toolbar">
    <!-- Undo/Redo -->
    <button class="tb-btn" id="btn-undo" title="تراجع (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h10a5 5 0 0 1 0 10H3"/><polyline points="7 6 3 10 7 14"/></svg>
    </button>
    <button class="tb-btn" id="btn-redo" title="إعادة (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10H11a5 5 0 0 0 0 10h10"/><polyline points="17 6 21 10 17 14"/></svg>
    </button>
    <div class="tb-sep"></div>

    <!-- Font size -->
    <select class="tb-select" id="sel-size" title="حجم الخط">
      <option>10</option><option>11</option><option selected>12</option>
      <option>13</option><option>14</option><option>16</option>
      <option>18</option><option>20</option><option>24</option>
    </select>
    <div class="tb-sep"></div>

    <!-- Format -->
    <button class="tb-btn" id="btn-bold" title="عريض (Ctrl+B)"><b>B</b></button>
    <button class="tb-btn" id="btn-italic" title="مائل (Ctrl+I)"><i>I</i></button>
    <button class="tb-btn" id="btn-under" title="تسطير (Ctrl+U)"><u>U</u></button>
    <div class="tb-sep"></div>

    <!-- Color -->
    <label title="لون النص">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;pointer-events:none"><path d="M4 20h16M12 4l6 12H6L12 4z"/></svg>
      <input type="color" id="pick-color" class="tb-color" value="#cdd6f4" title="لون النص">
    </label>
    <label title="لون الخلفية">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;pointer-events:none"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
      <input type="color" id="pick-bg" class="tb-color" value="#1e1e2e" title="لون الخلفية">
    </label>
    <div class="tb-sep"></div>

    <!-- Align -->
    <button class="tb-btn" id="btn-left" title="يسار">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
    </button>
    <button class="tb-btn" id="btn-center" title="وسط">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button class="tb-btn" id="btn-right" title="يمين">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="tb-sep"></div>

    <!-- Rows/Cols -->
    <button class="tb-btn" id="btn-add-row" title="إضافة صف">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      صف
    </button>
    <button class="tb-btn" id="btn-add-col" title="إضافة عمود">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      عمود
    </button>
    <div class="tb-sep"></div>

    <!-- Import / Export -->
    <button class="tb-btn" id="btn-import" title="استيراد Excel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      استيراد
    </button>
    <button class="tb-btn" id="btn-export" title="تصدير Excel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      تصدير Excel
    </button>
    <button class="tb-btn" id="btn-clear" title="مسح الكل" style="color:#f38ba8">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      مسح الكل
    </button>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none">
  </div>

  <!-- FORMULA BAR -->
  <div id="formula-bar">
    <span id="cell-ref">A1</span>
    <span style="color:#45475a;font-size:11px">fx</span>
    <input id="formula-input" placeholder="اكتب قيمة أو معادلة مثال: =SUM(A1:A10)" spellcheck="false">
  </div>

  <!-- GRID AREA -->
  <div id="grid-area">
    <div id="grid-wrap">
      <table id="grid"></table>
    </div>
  </div>

  <!-- STATUS BAR -->
  <div id="status-bar">
    <span id="status-sel">A1</span>
    <span id="status-count">عدد: 0</span>
    <span id="status-sum">مجموع: 0</span>
    <span id="status-avg">متوسط: 0</span>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="ctx-item" data-action="copy">نسخ</div>
  <div class="ctx-item" data-action="paste">لصق</div>
  <div class="ctx-item" data-action="cut">قص</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="insert-row-above">إدراج صف فوق</div>
  <div class="ctx-item" data-action="insert-row-below">إدراج صف أسفل</div>
  <div class="ctx-item" data-action="insert-col-left">إدراج عمود يسار</div>
  <div class="ctx-item" data-action="insert-col-right">إدراج عمود يمين</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="del-row" style="color:#f38ba8">حذف الصف</div>
  <div class="ctx-item" data-action="del-col" style="color:#f38ba8">حذف العمود</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="clear-cell">مسح الخلية</div>
</div>

<!-- INLINE EDITOR -->
<input id="cell-editor" spellcheck="false">

<script>
// ══════════════════════════════════════════════
// DZ Excel Engine — Vanilla JS Spreadsheet
// ══════════════════════════════════════════════

const ROWS_INIT = 50, COLS_INIT = 20;
let ROWS = ROWS_INIT, COLS = COLS_INIT;

// Data stores
let data = [];    // data[r][c] = raw string
let vals = [];    // vals[r][c] = computed value
let fmts = [];    // fmts[r][c] = { bold, italic, under, color, bg, align, size }

// Selection
let sel = { r: 0, c: 0 };
let rangeStart = null, rangeEnd = null;

// History for undo/redo
let history = [], histIdx = -1;

// Clipboard
let clipboard = null;

// Init data stores
function initStores() {
  data = Array.from({length: ROWS}, () => Array(COLS).fill(''));
  vals = Array.from({length: ROWS}, () => Array(COLS).fill(''));
  fmts = Array.from({length: ROWS}, () => Array(COLS).fill(null).map(() => ({
    bold:false, italic:false, under:false, color:'', bg:'', align:'left', size:12
  })));
}

// ── Column label (0→A, 25→Z, 26→AA ...) ──
function colLabel(c) {
  let s = '';
  c++;
  while (c > 0) {
    c--;
    s = String.fromCharCode(65 + (c % 26)) + s;
    c = Math.floor(c / 26);
  }
  return s;
}

function cellRef(r, c) { return colLabel(c) + (r + 1); }

// ── Parse cell reference ──
function parseRef(ref) {
  const m = ref.toUpperCase().match(/^([A-Z]+)(\d+)$/);
  if (!m) return null;
  let col = 0;
  for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64);
  col--;
  const row = parseInt(m[2]) - 1;
  return (row >= 0 && row < ROWS && col >= 0 && col < COLS) ? {r: row, c: col} : null;
}

// ── Parse range A1:B5 → array of {r,c} ──
function parseRange(range) {
  const [a, b] = range.split(':');
  const s = parseRef(a), e = b ? parseRef(b) : s;
  if (!s) return [];
  const cells = [];
  const r1=Math.min(s.r,e.r), r2=Math.max(s.r,e.r);
  const c1=Math.min(s.c,e.c), c2=Math.max(s.c,e.c);
  for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++) cells.push({r,c});
  return cells;
}

// ── Formula evaluator ──
function evalCell(r, c, visited = new Set()) {
  const raw = (data[r] && data[r][c]) ? data[r][c].trim() : '';
  if (!raw) return '';
  if (!raw.startsWith('=')) {
    // Strict number parse: must be entirely numeric
    const n = Number(raw.replace(/,/g, '.'));
    return (!isNaN(n) && raw.replace(/,/g,'.').trim() !== '') ? n : raw;
  }

  const key = `${r},${c}`;
  if (visited.has(key)) return '#REF!';
  visited.add(key);

  const expr = raw.slice(1).trim().toUpperCase();

  // ── Collect numeric values from one or more ranges/refs separated by commas ──
  const getMultiRange = (argStr) => {
    const parts = splitArgs(argStr);
    const nums = [];
    for (const part of parts) {
      const p = part.trim();
      if (p.includes(':')) {
        parseRange(p).forEach(({r:rr,c:cc}) => {
          const v = evalCell(rr, cc, new Set(visited));
          const n = toNum(v);
          if (!isNaN(n)) nums.push(n);
        });
      } else {
        const ref = parseRef(p);
        if (ref) {
          const v = evalCell(ref.r, ref.c, new Set(visited));
          const n = toNum(v);
          if (!isNaN(n)) nums.push(n);
        } else {
          const n = toNum(evalExpr(p, r, c, new Set(visited)));
          if (!isNaN(n)) nums.push(n);
        }
      }
    }
    return nums;
  };

  // ── Collect ALL cell values (including non-numeric) for COUNTA ──
  const getMultiAll = (argStr) => {
    const parts = splitArgs(argStr);
    const vals2 = [];
    for (const part of parts) {
      const p = part.trim();
      if (p.includes(':')) {
        parseRange(p).forEach(({r:rr,c:cc}) => {
          const v = evalCell(rr, cc, new Set(visited));
          if (v !== '' && v !== null && v !== undefined) vals2.push(v);
        });
      } else {
        const ref = parseRef(p);
        if (ref) {
          const v = evalCell(ref.r, ref.c, new Set(visited));
          if (v !== '' && v !== null && v !== undefined) vals2.push(v);
        }
      }
    }
    return vals2;
  };

  // ── Built-in functions ──
  const fnMatch = expr.match(/^([A-Z][A-Z0-9]*)\((.+)\)$/s);
  if (fnMatch) {
    const fn  = fnMatch[1];
    const arg = fnMatch[2].trim();
    const ps  = splitArgs(arg);   // pre-split args

    // Aggregation
    if (fn === 'SUM') {
      return getMultiRange(arg).reduce((a,b)=>a+b, 0);
    }
    if (fn === 'AVERAGE' || fn === 'AVG' || fn === 'MEAN') {
      const ns = getMultiRange(arg);
      return ns.length ? ns.reduce((a,b)=>a+b,0)/ns.length : '#DIV/0!';
    }
    if (fn === 'COUNT') {
      return getMultiRange(arg).length;
    }
    if (fn === 'COUNTA') {
      return getMultiAll(arg).length;
    }
    if (fn === 'MAX') {
      const ns = getMultiRange(arg); return ns.length ? Math.max(...ns) : 0;
    }
    if (fn === 'MIN') {
      const ns = getMultiRange(arg); return ns.length ? Math.min(...ns) : 0;
    }
    if (fn === 'PRODUCT') {
      return getMultiRange(arg).reduce((a,b)=>a*b, 1);
    }

    // Math
    if (fn === 'ABS') {
      return Math.abs(toNum(evalExpr(arg, r, c, new Set(visited))));
    }
    if (fn === 'SQRT') {
      const v = toNum(evalExpr(arg, r, c, new Set(visited)));
      return v < 0 ? '#NUM!' : Math.sqrt(v);
    }
    if (fn === 'POWER' || fn === 'POW') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const e2 = toNum(evalExpr(ps[1]?.trim() || '2', r, c, new Set(visited)));
      return Math.pow(v, e2);
    }
    if (fn === 'MOD') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const d = toNum(evalExpr(ps[1]?.trim() || '1', r, c, new Set(visited)));
      return d === 0 ? '#DIV/0!' : v % d;
    }
    if (fn === 'INT' || fn === 'TRUNC') {
      return Math.trunc(toNum(evalExpr(arg, r, c, new Set(visited))));
    }
    if (fn === 'FLOOR') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const s = toNum(evalExpr(ps[1]?.trim() || '1', r, c, new Set(visited)));
      return Math.floor(v / s) * s;
    }
    if (fn === 'CEILING' || fn === 'CEIL') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const s = toNum(evalExpr(ps[1]?.trim() || '1', r, c, new Set(visited)));
      return Math.ceil(v / s) * s;
    }
    if (fn === 'ROUND') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const d = parseInt(ps[1]?.trim() || '0');
      return parseFloat(v.toFixed(d));
    }
    if (fn === 'ROUNDUP') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const d = parseInt(ps[1]?.trim() || '0');
      const f = Math.pow(10, d);
      return Math.ceil(v * f) / f;
    }
    if (fn === 'ROUNDDOWN') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const d = parseInt(ps[1]?.trim() || '0');
      const f = Math.pow(10, d);
      return Math.floor(v * f) / f;
    }
    if (fn === 'LN')   return Math.log(toNum(evalExpr(arg, r, c, new Set(visited))));
    if (fn === 'LOG10') return Math.log10(toNum(evalExpr(arg, r, c, new Set(visited))));
    if (fn === 'LOG') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const base = ps[1] ? toNum(evalExpr(ps[1].trim(), r, c, new Set(visited))) : 10;
      return Math.log(v) / Math.log(base);
    }
    if (fn === 'EXP')   return Math.exp(toNum(evalExpr(arg, r, c, new Set(visited))));
    if (fn === 'PI')    return Math.PI;
    if (fn === 'SIN')   return Math.sin(toNum(evalExpr(arg, r, c, new Set(visited))));
    if (fn === 'COS')   return Math.cos(toNum(evalExpr(arg, r, c, new Set(visited))));
    if (fn === 'TAN')   return Math.tan(toNum(evalExpr(arg, r, c, new Set(visited))));
    if (fn === 'RAND')  return Math.random();
    if (fn === 'RANDBETWEEN') {
      const lo = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const hi = toNum(evalExpr(ps[1]?.trim() || '100', r, c, new Set(visited)));
      return Math.floor(Math.random() * (hi - lo + 1)) + lo;
    }

    // Logic
    if (fn === 'IF') {
      if (ps.length < 2) return '#ARG!';
      const cond = evalExpr(ps[0].trim(), r, c, new Set(visited));
      const truthy = !!(typeof cond === 'number' ? cond !== 0 : cond);
      if (ps.length === 2) return truthy ? evalExpr(ps[1].trim(), r, c, new Set(visited)) : '';
      return truthy ? evalExpr(ps[1].trim(), r, c, new Set(visited))
                    : evalExpr(ps[2].trim(), r, c, new Set(visited));
    }
    if (fn === 'IFERROR') {
      try {
        const v = evalExpr(ps[0].trim(), r, c, new Set(visited));
        if (typeof v === 'string' && v.startsWith('#')) throw new Error(v);
        return v;
      } catch { return ps[1] ? evalExpr(ps[1].trim(), r, c, new Set(visited)) : ''; }
    }
    if (fn === 'AND') {
      return ps.every(a => !!evalExpr(a.trim(), r, c, new Set(visited)));
    }
    if (fn === 'OR') {
      return ps.some(a => !!evalExpr(a.trim(), r, c, new Set(visited)));
    }
    if (fn === 'NOT') {
      return !evalExpr(arg, r, c, new Set(visited));
    }
    if (fn === 'ISNUMBER') {
      const v = evalExpr(arg, r, c, new Set(visited));
      return typeof v === 'number' && !isNaN(v);
    }
    if (fn === 'ISTEXT') {
      const v = evalExpr(arg, r, c, new Set(visited));
      return typeof v === 'string';
    }
    if (fn === 'ISBLANK') {
      const v = evalExpr(arg, r, c, new Set(visited));
      return v === '' || v === null || v === undefined;
    }

    // Text
    if (fn === 'CONCAT' || fn === 'CONCATENATE') {
      return ps.map(a => {
        const v = evalExpr(a.trim(), r, c, new Set(visited));
        return v !== null && v !== undefined ? String(v) : '';
      }).join('');
    }
    if (fn === 'LEFT') {
      const s = String(evalExpr(ps[0].trim(), r, c, new Set(visited)) ?? '');
      return s.slice(0, parseInt(ps[1]?.trim() || '1'));
    }
    if (fn === 'RIGHT') {
      const s = String(evalExpr(ps[0].trim(), r, c, new Set(visited)) ?? '');
      const n2 = parseInt(ps[1]?.trim() || '1');
      return s.slice(-n2);
    }
    if (fn === 'MID') {
      const s = String(evalExpr(ps[0].trim(), r, c, new Set(visited)) ?? '');
      const start = parseInt(ps[1]?.trim() || '1') - 1;
      const len2 = parseInt(ps[2]?.trim() || '1');
      return s.slice(start, start + len2);
    }
    if (fn === 'LEN') {
      return String(evalExpr(arg, r, c, new Set(visited)) ?? '').length;
    }
    if (fn === 'UPPER')  return String(evalExpr(arg,r,c,new Set(visited))??'').toUpperCase();
    if (fn === 'LOWER')  return String(evalExpr(arg,r,c,new Set(visited))??'').toLowerCase();
    if (fn === 'TRIM')   return String(evalExpr(arg,r,c,new Set(visited))??'').trim();
    if (fn === 'TEXT') {
      const v = toNum(evalExpr(ps[0].trim(), r, c, new Set(visited)));
      const fmt2 = (ps[1]?.trim() || '').replace(/^"|"$/g, '');
      if (fmt2.includes('%')) return (v * 100).toFixed(fmt2.replace(/[^0]/g,'').length) + '%';
      const dec = (fmt2.match(/\.([0#]+)/) || [,''])[1].length;
      return v.toFixed(dec);
    }
    if (fn === 'VALUE') {
      const v = toNum(evalExpr(arg, r, c, new Set(visited)));
      return isNaN(v) ? '#VALUE!' : v;
    }
    if (fn === 'FIND' || fn === 'SEARCH') {
      const needle = String(evalExpr(ps[0].trim(), r, c, new Set(visited)) ?? '');
      const haystack = String(evalExpr(ps[1].trim(), r, c, new Set(visited)) ?? '');
      const idx2 = fn === 'SEARCH'
        ? haystack.toLowerCase().indexOf(needle.toLowerCase())
        : haystack.indexOf(needle);
      return idx2 === -1 ? '#VALUE!' : idx2 + 1;
    }
    if (fn === 'SUBSTITUTE') {
      const s = String(evalExpr(ps[0].trim(), r, c, new Set(visited)) ?? '');
      const old2 = String(evalExpr(ps[1].trim(), r, c, new Set(visited)) ?? '');
      const newStr = String(evalExpr(ps[2].trim(), r, c, new Set(visited)) ?? '');
      return s.split(old2).join(newStr);
    }
    if (fn === 'REPT') {
      const s = String(evalExpr(ps[0].trim(), r, c, new Set(visited)) ?? '');
      const times = parseInt(evalExpr(ps[1]?.trim() || '1', r, c, new Set(visited)));
      return s.repeat(Math.max(0, times));
    }

    // Date
    if (fn === 'TODAY') return new Date().toLocaleDateString('fr-DZ');
    if (fn === 'NOW')   return new Date().toLocaleString('fr-DZ');
    if (fn === 'YEAR')  {
      const d = new Date(String(evalExpr(arg,r,c,new Set(visited))??''));
      return isNaN(d.getTime()) ? '#VALUE!' : d.getFullYear();
    }
    if (fn === 'MONTH') {
      const d = new Date(String(evalExpr(arg,r,c,new Set(visited))??''));
      return isNaN(d.getTime()) ? '#VALUE!' : d.getMonth() + 1;
    }
    if (fn === 'DAY') {
      const d = new Date(String(evalExpr(arg,r,c,new Set(visited))??''));
      return isNaN(d.getTime()) ? '#VALUE!' : d.getDate();
    }

    // SUMIF
    if (fn === 'SUMIF') {
      if (ps.length < 3) return '#ARG!';
      const rangeCells = parseRange(ps[0].trim());
      const criteriaRaw = evalExpr(ps[1].trim(), r, c, new Set(visited));
      const sumRange = ps[2] ? parseRange(ps[2].trim()) : rangeCells;
      let total = 0;
      rangeCells.forEach(({r:rr,c:cc}, i) => {
        const cv = evalCell(rr, cc, new Set(visited));
        if (matchesCriteria(cv, criteriaRaw)) {
          const sr = sumRange[i] || {r:rr,c:cc};
          const sv = evalCell(sr.r, sr.c, new Set(visited));
          total += toNum(sv) || 0;
        }
      });
      return total;
    }
    if (fn === 'COUNTIF') {
      const rangeCells = parseRange(ps[0].trim());
      const criteriaRaw = evalExpr(ps[1].trim(), r, c, new Set(visited));
      return rangeCells.filter(({r:rr,c:cc}) => {
        return matchesCriteria(evalCell(rr, cc, new Set(visited)), criteriaRaw);
      }).length;
    }

    // VLOOKUP
    if (fn === 'VLOOKUP') {
      if (ps.length < 3) return '#ARG!';
      const lookup = evalExpr(ps[0].trim(), r, c, new Set(visited));
      const tableRange = parseRange(ps[1].trim());
      const colIdx = toNum(evalExpr(ps[2].trim(), r, c, new Set(visited))) - 1;
      const exact = ps[3] ? evalExpr(ps[3].trim(), r, c, new Set(visited)) === false : true;
      const rows2 = {};
      tableRange.forEach(({r:rr,c:cc}) => { if (!rows2[rr]) rows2[rr]=[]; rows2[rr][cc]=evalCell(rr,cc,new Set(visited)); });
      const minCol = Math.min(...tableRange.map(x=>x.c));
      for (const rr of Object.keys(rows2).map(Number).sort((a,b)=>a-b)) {
        const key2 = rows2[rr][minCol];
        if (exact ? key2 == lookup : toNum(key2) <= toNum(lookup)) {
          const targetCol = minCol + colIdx;
          return rows2[rr][targetCol] ?? '#N/A';
        }
      }
      return '#N/A';
    }
  }

  // Expression with operators (handles arithmetic + cell refs + comparisons)
  return evalExpr(expr, r, c, visited);
}

// ── Helper: convert value to number ──
function toNum(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  const n = Number(String(v ?? '').replace(/,/g, '.').replace(/\s/g, ''));
  return isNaN(n) ? NaN : n;
}

// ── Helper: SUMIF/COUNTIF criteria matching ──
function matchesCriteria(val, criteria) {
  if (typeof criteria === 'string') {
    const opM = criteria.match(/^(<=|>=|<>|<|>|=)\s*(.+)$/);
    if (opM) {
      const [, op, right] = opM;
      const l = toNum(val), rr = toNum(right);
      if (op === '<=') return l <= rr;
      if (op === '>=') return l >= rr;
      if (op === '<>') return String(val) !== right;
      if (op === '<')  return l < rr;
      if (op === '>')  return l > rr;
      if (op === '=')  return String(val) === right;
    }
    return String(val).toLowerCase() === String(criteria).toLowerCase();
  }
  return val == criteria;
}

function splitArgs(s) {
  const parts = [];
  let cur = '', depth = 0;
  for (const ch of s) {
    if (ch === '(') { depth++; cur += ch; }
    else if (ch === ')') { depth--; cur += ch; }
    else if (ch === ',' && depth === 0) { parts.push(cur); cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || parts.length > 0) parts.push(cur);
  return parts;
}

// ── Find operator index respecting parentheses ──
function findOpIdx(e, op) {
  let depth = 0;
  // Search from right for + and - (lowest precedence), left for * / ^ (higher)
  const rightAssoc = (op === '+' || op === '-' || op === '&');
  const start = rightAssoc ? e.length - op.length : 0;
  const step  = rightAssoc ? -1 : 1;
  let i = start;
  while (rightAssoc ? i >= 0 : i <= e.length - op.length) {
    const ch = e[i];
    if (ch === ')') depth++;
    else if (ch === '(') depth--;
    if (depth === 0 && e.slice(i, i + op.length) === op) {
      // Don't pick up '-' that's really a unary minus (nothing meaningful before it)
      if (op === '-' && i === 0) { i += step; continue; }
      if (op === '-' && i > 0 && /[+\-*/^(]/.test(e[i-1])) { i += step; continue; }
      return i;
    }
    i += step;
  }
  return -1;
}

function evalExpr(expr, r, c, visited) {
  let e = expr.trim();
  if (!e) return '';

  // String literal
  if (e.startsWith('"') && e.endsWith('"') && e.length >= 2) return e.slice(1, -1);

  // Pure number — strict: entire string is a valid finite number
  const asNum = Number(e.replace(/,/g, '.'));
  if (e !== '' && !isNaN(asNum) && isFinite(asNum) && !/[a-zA-Z(]/.test(e)) return asNum;

  // Single cell reference
  const ref = parseRef(e);
  if (ref) return evalCell(ref.r, ref.c, new Set(visited));

  // Boolean literals
  if (e === 'TRUE')  return true;
  if (e === 'FALSE') return false;

  // Parenthesised expression: (expr)
  if (e.startsWith('(') && e.endsWith(')')) {
    // Verify the parens are balanced as a group
    let d = 0; let balanced = false;
    for (let i = 0; i < e.length; i++) {
      if (e[i] === '(') d++;
      else if (e[i] === ')') { d--; if (d === 0 && i === e.length - 1) balanced = true; }
    }
    if (balanced) return evalExpr(e.slice(1, -1), r, c, visited);
  }

  // Nested function call
  const fm = e.match(/^([A-Z][A-Z0-9]*)\((.+)\)$/s);
  if (fm) {
    const tmp = data[r][c];
    data[r][c] = '=' + e;
    const result = evalCell(r, c, new Set(visited));
    data[r][c] = tmp;
    return result;
  }

  // String concatenation with &
  const ampIdx = findOpIdx(e, '&');
  if (ampIdx > 0) {
    const left  = evalExpr(e.slice(0, ampIdx).trim(), r, c, visited);
    const right = evalExpr(e.slice(ampIdx + 1).trim(), r, c, visited);
    return String(left ?? '') + String(right ?? '');
  }

  // Comparison operators (multi-char first)
  for (const op of ['<=', '>=', '<>', '<>', '<', '>', '=']) {
    const idx = findOpIdx(e, op);
    if (idx > 0) {
      const left  = evalExpr(e.slice(0, idx).trim(), r, c, visited);
      const right = evalExpr(e.slice(idx + op.length).trim(), r, c, visited);
      const l = toNum(left), ri = toNum(right);
      if (op === '<=') return isNaN(l)||isNaN(ri) ? String(left)<=String(right) : l<=ri;
      if (op === '>=') return isNaN(l)||isNaN(ri) ? String(left)>=String(right) : l>=ri;
      if (op === '<>') return left != right;
      if (op === '<')  return isNaN(l)||isNaN(ri) ? String(left)<String(right)  : l<ri;
      if (op === '>')  return isNaN(l)||isNaN(ri) ? String(left)>String(right)  : l>ri;
      if (op === '=')  return left == right;
    }
  }

  // Arithmetic: resolve cell refs, then evaluate safely
  // Replace cell refs (like A1, B12, AA3) with their computed numeric values
  try {
    // First replace all cell references with their evaluated numeric values
    // If any referenced cell contains text (non-numeric), return #VALUE! immediately
    let textCellFound = false;
    const resolved = e.replace(/\b([A-Z]{1,3}\d{1,7})\b/g, (match) => {
      const cr = parseRef(match);
      if (!cr) return '0';
      const v = evalCell(cr.r, cr.c, new Set(visited));
      if (v === '' || v === null || v === undefined) return '0'; // empty cell = 0
      const n = toNum(v);
      if (isNaN(n)) { textCellFound = true; return '0'; } // text cell — flag error
      return String(n);
    });
    if (textCellFound) return '#VALUE!'; // arithmetic on text cell is invalid
    // Allow only safe arithmetic characters
    const safe = resolved.replace(/[^0-9+\-*/.() %^Ee]/g, '');
    if (!safe.trim()) return '#ERR!';
    // Handle ^ as power operator
    const withPow = safe.replace(/(\d+(?:\.\d+)?(?:[Ee][+\-]?\d+)?)\^(\d+(?:\.\d+)?)/g,
      (_, a2, b2) => `Math.pow(${a2},${b2})`);
    // eslint-disable-next-line no-new-func
    const result = Function('"use strict";return(' + withPow + ')')();
    return typeof result === 'number' && isFinite(result) ? result : '#ERR!';
  } catch { return '#ERR!'; }
}

// ── Recompute all cells ──
function recompute() {
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    try { vals[r][c] = evalCell(r, c); }
    catch { vals[r][c] = '#ERR!'; }
  }
}

// ── Build the grid DOM ──
function buildGrid() {
  const table = document.getElementById('grid');
  table.innerHTML = '';

  // Header row
  const thead = table.createTHead();
  const hr = thead.insertRow();
  const corner = document.createElement('th');
  corner.className='col-header corner';
  hr.appendChild(corner);
  for (let c=0;c<COLS;c++) {
    const th = document.createElement('th');
    th.className='col-header';
    th.textContent = colLabel(c);
    hr.appendChild(th);
  }

  // Data rows
  const tbody = table.createTBody();
  for (let r=0;r<ROWS;r++) {
    const tr = tbody.insertRow();
    const rh = document.createElement('th');
    rh.className='row-header';
    rh.textContent = r+1;
    tr.appendChild(rh);
    for (let c=0;c<COLS;c++) {
      const td = tr.insertCell();
      td.className='cell';
      td.dataset.r = r;
      td.dataset.c = c;
      td.tabIndex = -1;
      tr.appendChild(td);
    }
  }
}

// ── Render a single cell ──
function renderCell(r, c) {
  const td = getCell(r, c);
  if (!td) return;
  const fmt = fmts[r][c];
  const v = vals[r][c];
  td.textContent = v !== null && v !== undefined ? String(v) : '';
  td.style.fontWeight   = fmt.bold ? 'bold' : '';
  td.style.fontStyle    = fmt.italic ? 'italic' : '';
  td.style.textDecoration= fmt.under ? 'underline' : '';
  td.style.color        = fmt.color || '';
  td.style.backgroundColor = fmt.bg || '';
  td.style.fontSize     = (fmt.size || 12) + 'px';
  td.className = 'cell' + (fmt.align ? ` align-${fmt.align}` : '');
  if (r === sel.r && c === sel.c) td.classList.add('selected');
}

// ── Render all cells ──
function renderAll() {
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) renderCell(r,c);
  updateStatus();
}

// ── Get TD element ──
function getCell(r, c) {
  const tbody = document.querySelector('#grid tbody');
  if (!tbody || !tbody.rows[r]) return null;
  return tbody.rows[r].cells[c+1];
}

// ── Select a cell ──
function selectCell(r, c, scroll=true) {
  const prev = getCell(sel.r, sel.c);
  if (prev) { prev.classList.remove('selected'); }
  sel.r = Math.max(0, Math.min(ROWS-1, r));
  sel.c = Math.max(0, Math.min(COLS-1, c));
  const td = getCell(sel.r, sel.c);
  if (td) {
    td.classList.add('selected');
    if (scroll) td.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  const ref = cellRef(sel.r, sel.c);
  document.getElementById('cell-ref').textContent = ref;
  document.getElementById('formula-input').value = data[sel.r][sel.c] || '';
  updateStatus();
}

// ── Status bar ──
function updateStatus() {
  const ref = cellRef(sel.r, sel.c);
  document.getElementById('status-sel').textContent = ref;
  // Numeric stats for selection
  const v = vals[sel.r][sel.c];
  const n = typeof v === 'number' ? v : parseFloat(v);
  document.getElementById('status-sum').textContent = isNaN(n) ? 'مجموع: -' : `مجموع: ${n}`;
  document.getElementById('status-avg').textContent = isNaN(n) ? 'متوسط: -' : `متوسط: ${n}`;
  document.getElementById('status-count').textContent = `عدد: 1`;
}

// ── Set cell value ──
function setCellValue(r, c, raw, addHistory=true) {
  if (addHistory) pushHistory();
  data[r][c] = raw;
  recompute();
  renderAll();
  if (r===sel.r && c===sel.c) {
    document.getElementById('formula-input').value = raw;
  }
}

// ── Format operations ──
function setFormat(key, value) {
  pushHistory();
  fmts[sel.r][sel.c][key] = value;
  renderCell(sel.r, sel.c);
}

// ── History ──
function pushHistory() {
  const snap = {
    data: data.map(r=>[...r]),
    fmts: fmts.map(r=>r.map(f=>({...f})))
  };
  history = history.slice(0, histIdx+1);
  history.push(snap);
  histIdx = history.length - 1;
  if (history.length > 100) { history.shift(); histIdx--; }
}

function undo() {
  if (histIdx <= 0) return;
  histIdx--;
  const snap = history[histIdx];
  data = snap.data.map(r=>[...r]);
  fmts = snap.fmts.map(r=>r.map(f=>({...f})));
  recompute(); renderAll();
}

function redo() {
  if (histIdx >= history.length-1) return;
  histIdx++;
  const snap = history[histIdx];
  data = snap.data.map(r=>[...r]);
  fmts = snap.fmts.map(r=>r.map(f=>({...f})));
  recompute(); renderAll();
}

// ── Inline editor ──
const editor = document.getElementById('cell-editor');
let editing = false;

function startEdit(r, c, initialVal) {
  const td = getCell(r, c);
  if (!td) return;
  editing = true;
  const rect = td.getBoundingClientRect();
  const wrapRect = document.getElementById('grid-wrap').getBoundingClientRect();
  editor.style.display = 'block';
  editor.style.left  = (rect.left - wrapRect.left + document.getElementById('grid-wrap').scrollLeft) + 'px';
  editor.style.top   = (rect.top  - wrapRect.top  + document.getElementById('grid-wrap').scrollTop)  + 'px';
  editor.style.width  = Math.max(rect.width, 120) + 'px';
  editor.style.height = rect.height + 'px';
  editor.style.fontSize = (fmts[r][c].size || 12) + 'px';
  editor.value = initialVal !== undefined ? initialVal : (data[r][c] || '');
  editor.focus();
  editor.select();
  // Position editor inside grid-wrap
  document.getElementById('grid-wrap').appendChild(editor);
}

function commitEdit() {
  if (!editing) return;
  editing = false;
  editor.style.display = 'none';
  setCellValue(sel.r, sel.c, editor.value);
}

function cancelEdit() {
  editing = false;
  editor.style.display = 'none';
}

editor.addEventListener('keydown', e => {
  if (e.key === 'Enter') { commitEdit(); e.preventDefault(); selectCell(sel.r+1, sel.c); }
  if (e.key === 'Tab')   { commitEdit(); e.preventDefault(); selectCell(sel.r, sel.c+1); }
  if (e.key === 'Escape'){ cancelEdit(); }
});

// ── Grid keyboard nav ──
document.addEventListener('keydown', e => {
  if (editing) return;
  if (e.target === document.getElementById('formula-input')) return;

  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z') { undo(); e.preventDefault(); return; }
    if (e.key === 'y') { redo(); e.preventDefault(); return; }
    if (e.key === 'b') { setFormat('bold', !fmts[sel.r][sel.c].bold); e.preventDefault(); return; }
    if (e.key === 'i') { setFormat('italic', !fmts[sel.r][sel.c].italic); e.preventDefault(); return; }
    if (e.key === 'u') { setFormat('under', !fmts[sel.r][sel.c].under); e.preventDefault(); return; }
    if (e.key === 'c') { clipboard = { data: data[sel.r][sel.c], fmt: {...fmts[sel.r][sel.c]} }; return; }
    if (e.key === 'v') {
      if (clipboard) {
        setCellValue(sel.r, sel.c, clipboard.data);
        fmts[sel.r][sel.c] = {...clipboard.fmt};
        renderCell(sel.r, sel.c);
      }
      return;
    }
  }

  const nav = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if (nav[e.key]) {
    selectCell(sel.r+nav[e.key][0], sel.c+nav[e.key][1]);
    e.preventDefault(); return;
  }
  if (e.key === 'Tab')   { selectCell(sel.r, sel.c+1); e.preventDefault(); return; }
  if (e.key === 'Enter') { startEdit(sel.r, sel.c, undefined); e.preventDefault(); return; }
  if (e.key === 'Delete'||e.key==='Backspace') {
    if (!editing) { setCellValue(sel.r, sel.c, ''); e.preventDefault(); return; }
  }
  if (e.key === 'F2') { startEdit(sel.r, sel.c, undefined); e.preventDefault(); return; }
  // Start typing → open editor
  if (e.key.length===1 && !e.ctrlKey && !e.metaKey) {
    startEdit(sel.r, sel.c, e.key);
    e.preventDefault();
  }
});

// ── Grid click ──
document.getElementById('grid').addEventListener('mousedown', e => {
  const td = e.target.closest('td.cell');
  if (!td) return;
  if (editing) commitEdit();
  const r = parseInt(td.dataset.r), c = parseInt(td.dataset.c);
  selectCell(r, c);
  if (e.detail === 2) startEdit(r, c, undefined);
});

// ── Formula bar ──
const fInput = document.getElementById('formula-input');
fInput.addEventListener('change', () => {
  setCellValue(sel.r, sel.c, fInput.value);
  recompute(); renderAll();
});
fInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    setCellValue(sel.r, sel.c, fInput.value);
    recompute(); renderAll();
    e.preventDefault();
  }
});

// ── TOOLBAR BINDINGS ──
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);
document.getElementById('btn-bold').addEventListener('click', () => setFormat('bold', !fmts[sel.r][sel.c].bold));
document.getElementById('btn-italic').addEventListener('click', () => setFormat('italic', !fmts[sel.r][sel.c].italic));
document.getElementById('btn-under').addEventListener('click', () => setFormat('under', !fmts[sel.r][sel.c].under));
document.getElementById('pick-color').addEventListener('input', e => setFormat('color', e.target.value));
document.getElementById('pick-bg').addEventListener('input', e => setFormat('bg', e.target.value));
document.getElementById('btn-left').addEventListener('click', () => setFormat('align', 'left'));
document.getElementById('btn-center').addEventListener('click', () => setFormat('align', 'center'));
document.getElementById('btn-right').addEventListener('click', () => setFormat('align', 'right'));
document.getElementById('sel-size').addEventListener('change', e => setFormat('size', parseInt(e.target.value)));

document.getElementById('btn-add-row').addEventListener('click', () => {
  pushHistory();
  ROWS++;
  data.push(Array(COLS).fill(''));
  vals.push(Array(COLS).fill(''));
  fmts.push(Array(COLS).fill(null).map(() => ({bold:false,italic:false,under:false,color:'',bg:'',align:'left',size:12})));
  buildGrid(); recompute(); renderAll();
});

document.getElementById('btn-add-col').addEventListener('click', () => {
  pushHistory();
  COLS++;
  for (let r=0;r<ROWS;r++) { data[r].push(''); vals[r].push(''); fmts[r].push({bold:false,italic:false,under:false,color:'',bg:'',align:'left',size:12}); }
  buildGrid(); recompute(); renderAll();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('مسح جميع البيانات؟')) return;
  pushHistory();
  ROWS = ROWS_INIT; COLS = COLS_INIT;
  initStores(); buildGrid(); recompute(); renderAll();
});

// ── EXPORT ──
document.getElementById('btn-export').addEventListener('click', () => {
  const wb = XLSX.utils.book_new();
  const aoa = [];
  for (let r=0;r<ROWS;r++) {
    const row = [];
    for (let c=0;c<COLS;c++) {
      const v = vals[r][c];
      row.push(v !== '' ? v : null);
    }
    aoa.push(row);
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  XLSX.utils.book_append_sheet(wb, ws, 'DZ Excel');
  XLSX.writeFile(wb, 'dz-excel.xlsx');
});

// ── IMPORT ──
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(ev.target.result, {type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1});
    loadAOA(aoa);
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
});

function loadAOA(aoa) {
  pushHistory();
  ROWS = Math.max(ROWS_INIT, aoa.length + 10);
  COLS = Math.max(COLS_INIT, Math.max(...aoa.map(r=>r.length)) + 5);
  initStores();
  for (let r=0;r<aoa.length;r++) {
    for (let c=0;c<(aoa[r]||[]).length;c++) {
      const v = aoa[r][c];
      if (v !== null && v !== undefined && v !== '') {
        data[r][c] = String(v);
      }
    }
  }
  buildGrid(); recompute(); renderAll();
  selectCell(0, 0);
}

// ── CONTEXT MENU ──
const ctxMenu = document.getElementById('ctx-menu');
document.getElementById('grid').addEventListener('contextmenu', e => {
  const td = e.target.closest('td.cell');
  if (!td) return;
  e.preventDefault();
  const r=parseInt(td.dataset.r), c=parseInt(td.dataset.c);
  if (r!==sel.r||c!==sel.c) selectCell(r,c);
  ctxMenu.style.display='block';
  ctxMenu.style.left=e.clientX+'px';
  ctxMenu.style.top=e.clientY+'px';
});

document.addEventListener('click', () => { ctxMenu.style.display='none'; });

ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
  item.addEventListener('click', () => {
    const action = item.dataset.action;
    if (action==='copy') { clipboard={data:data[sel.r][sel.c],fmt:{...fmts[sel.r][sel.c]}}; }
    if (action==='paste' && clipboard) { setCellValue(sel.r,sel.c,clipboard.data); fmts[sel.r][sel.c]={...clipboard.fmt}; renderCell(sel.r,sel.c); }
    if (action==='cut') { clipboard={data:data[sel.r][sel.c],fmt:{...fmts[sel.r][sel.c]}}; setCellValue(sel.r,sel.c,''); }
    if (action==='clear-cell') setCellValue(sel.r,sel.c,'');
    if (action==='insert-row-above') {
      pushHistory();
      data.splice(sel.r,0,Array(COLS).fill(''));
      vals.splice(sel.r,0,Array(COLS).fill(''));
      fmts.splice(sel.r,0,Array(COLS).fill(null).map(()=>({bold:false,italic:false,under:false,color:'',bg:'',align:'left',size:12})));
      ROWS++; buildGrid(); recompute(); renderAll();
    }
    if (action==='insert-row-below') {
      pushHistory();
      data.splice(sel.r+1,0,Array(COLS).fill(''));
      vals.splice(sel.r+1,0,Array(COLS).fill(''));
      fmts.splice(sel.r+1,0,Array(COLS).fill(null).map(()=>({bold:false,italic:false,under:false,color:'',bg:'',align:'left',size:12})));
      ROWS++; buildGrid(); recompute(); renderAll();
    }
    if (action==='insert-col-left') {
      pushHistory();
      for(let r=0;r<ROWS;r++){data[r].splice(sel.c,0,'');vals[r].splice(sel.c,0,'');fmts[r].splice(sel.c,0,{bold:false,italic:false,under:false,color:'',bg:'',align:'left',size:12});}
      COLS++; buildGrid(); recompute(); renderAll();
    }
    if (action==='insert-col-right') {
      pushHistory();
      for(let r=0;r<ROWS;r++){data[r].splice(sel.c+1,0,'');vals[r].splice(sel.c+1,0,'');fmts[r].splice(sel.c+1,0,{bold:false,italic:false,under:false,color:'',bg:'',align:'left',size:12});}
      COLS++; buildGrid(); recompute(); renderAll();
    }
    if (action==='del-row' && ROWS>1) {
      pushHistory();
      data.splice(sel.r,1); vals.splice(sel.r,1); fmts.splice(sel.r,1); ROWS--;
      buildGrid(); recompute(); renderAll(); selectCell(Math.min(sel.r,ROWS-1),sel.c);
    }
    if (action==='del-col' && COLS>1) {
      pushHistory();
      for(let r=0;r<ROWS;r++){data[r].splice(sel.c,1);vals[r].splice(sel.c,1);fmts[r].splice(sel.c,1);}
      COLS--; buildGrid(); recompute(); renderAll(); selectCell(sel.r,Math.min(sel.c,COLS-1));
    }
    ctxMenu.style.display='none';
  });
});

// ══════════════════════════════════════════
// postMessage API — communication with parent
// ══════════════════════════════════════════
window.addEventListener('message', e => {
  const msg = e.data;
  if (!msg || !msg.action) return;

  if (msg.action === 'loadData') {
    // msg.rows: array of arrays
    const aoa = msg.rows || [];
    loadAOA(aoa);
    if (msg.headers) {
      // Apply header styling to first row
      for (let c=0;c<msg.headers.length && c<COLS;c++) {
        fmts[0][c].bold=true;
        fmts[0][c].bg='#1e3a5f';
        fmts[0][c].color='#89b4fa';
      }
      renderAll();
    }
  }

  if (msg.action === 'runMacro') {
    // msg.code: JS string using spreadsheet API
    try {
      // Expose API
      const api = { data, vals, fmts, ROWS, COLS,
        setCell: (r,c,v) => setCellValue(r,c,String(v)),
        setFmt: (r,c,k,v) => { fmts[r][c][k]=v; renderCell(r,c); },
        renderAll, recompute, colLabel, cellRef, parseRef,
        loadAOA,
      };
      // eslint-disable-next-line no-new-func
      new Function('api', 'with(api){' + msg.code + '}')(api);
      recompute(); renderAll();
      window.parent.postMessage({type:'macroResult', ok:true}, '*');
    } catch(err) {
      window.parent.postMessage({type:'macroResult', ok:false, error:err.message}, '*');
    }
  }

  if (msg.action === 'getData') {
    // Return current data as AOA
    window.parent.postMessage({
      type: 'sheetData',
      rows: data.slice(0,ROWS).map(r=>r.slice(0,COLS)),
      vals: vals.slice(0,ROWS).map(r=>r.slice(0,COLS)),
    }, '*');
  }
});

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
initStores();
buildGrid();
pushHistory(); // Initial snapshot
recompute();
renderAll();
selectCell(0, 0);

// Hide loading, show app
document.getElementById('loading').style.display = 'none';
document.getElementById('app').style.display     = 'flex';

// Ensure grid starts from column A (not scrolled right)
const gw = document.getElementById('grid-wrap');
gw.scrollLeft = 0;
gw.scrollTop  = 0;

// Notify parent
window.parent.postMessage({type:'ready'}, '*');

console.log('[DZ Excel] محرر Excel جاهز ✅');
</script>
</body>
