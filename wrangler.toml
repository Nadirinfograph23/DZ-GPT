name = "dzagent"
main = "workers/entry.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

# ── Static assets served via ASSETS binding ────────────────────────────────────
[assets]
directory = "./dist"
binding   = "ASSETS"
# Run the Worker first for API/WebSocket paths and its dynamically generated
# no-store version marker. Other static files stay on the asset router.
# Extensionless BrowserRouter paths continue to receive index.html through
# the SPA fallback below.
run_worker_first = ["/api/*", "/ws/*", "/version.json"]
not_found_handling = "single-page-application"

# ── Bundle server-side data files so readFileSync works ───────────────────────
[[rules]]
type    = "Text"
globs   = ["data/**/*.json", "dialect/**/*.json"]
fallthrough = true

# ── Non-secret environment variables ──────────────────────────────────────────
# Secrets are set via:
#   wrangler secret put AI_API_KEY  ... etc.
# OR via Cloudflare Dashboard → Workers → Settings → Variables

[vars]
NODE_ENV = "production"
CF_PAGES = "1"
# Live free-model pool. IDs are public model names; no credentials are stored here.
# The router merges this list with its built-in defaults and rotates across models.
OPENROUTER_FREE_MODELS = "openrouter/free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3.5-lightning:free,poolside/laguna-s-2.1:free,poolside/laguna-xs-2.1:free,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,qwen/qwen3.8-27b:free,nvidia/nemotron-3-super-120b-a12b:free,dots-studio/dots-3-note-preview:free,stealth/space-bunny-alpha"

# ── Define: replace import.meta.url so fileURLToPath() doesn't crash ──────────
# In CF Workers the bundled import.meta.url is undefined; give it a valid
# file:// URL so that path.dirname(fileURLToPath(...)) resolves to "/"
[define]
"import.meta.url" = '"file:///worker.js"'

# ── Aliases: stub out dev/build-only modules that must not be bundled ─────────
[alias]
"lightningcss" = "./workers/stubs/lightningcss.js"
"vite" = "./workers/stubs/vite.js"
"@distube/ytdl-core" = "./workers/stubs/ytdl-core.js"
"youtube-sr" = "./workers/stubs/youtube-sr.js"
"fast-xml-parser" = "./workers/stubs/fast-xml-parser.js"
"ws" = "./workers/stubs/ws.js"
